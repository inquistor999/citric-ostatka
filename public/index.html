<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Citric Ostatka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="header-top">
        <h1 class="app-title">Ostatka <span class="accent">Citric</span></h1>
        <p class="app-subtitle">Mahsulot qoldiqlari nazorati</p>
      </div>
      <div class="search-wrapper">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="product-search" placeholder="Mahsulotni qidiring..." autocomplete="off" />
      </div>
    </header>

    <main class="main-content">
      <div class="list-header">
        <h2>Barcha Mahsulotlar</h2>
        <span id="product-count">0 ta</span>
      </div>
      <div id="product-list" class="product-grid">
        <!-- Products generated by JS -->
      </div>
    </main>
  </div>

  <!-- Summary / Cart Panel -->
  <div id="summary-panel" class="summary-panel hidden">
    <div class="summary-header" id="summary-header-toggle">
      <div class="summary-info">
        <h3>Savat (<span id="selected-count">0</span> ta)</h3>
        <p>Tanlangan mahsulotlarni ko'rish</p>
      </div>
      <svg class="chevron-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </div>
    
    <div class="cart-items-container hidden" id="cart-items-container">
      <div id="cart-list" class="cart-list">
        <!-- Selected items go here -->
      </div>
      <button id="export-btn" class="primary-btn full-width mt-15">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        &nbsp; Excel yuklab olish
      </button>
    </div>
  </div>

  <!-- Input Modal -->
  <div id="input-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modal-product-name">Mahsulot nomi</h3>
        <button id="close-modal" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <label for="stock-qty">Qoldiq miqdori (kg)</label>
          <input type="number" id="stock-qty" placeholder="Masalan: 15" inputmode="decimal" />
        </div>
        <div class="input-group">
          <label for="stock-comment">Izoh (ixtiyoriy)</label>
          <textarea id="stock-comment" placeholder="Mahsulot haqida qo'shimcha ma'lumot..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button id="save-stock" class="primary-btn full-width">Saqlash va Savatga qo'shish</button>
        <button id="remove-stock" class="danger-btn full-width hidden mt-10">Savatdan olib tashlash</button>
      </div>
    </div>
  </div>
</body>
</html>
